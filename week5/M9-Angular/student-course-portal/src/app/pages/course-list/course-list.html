<h2>Course List</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" placeholder="Search courses" name="search">

<p *ngIf="isLoading">Loading courses...</p>
<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

<div *ngIf="!isLoading">
  <ng-container *ngIf="courses.length > 0; else noCourses">
    <div *ngFor="let course of courses; let i = index; trackBy: trackByCourseId" (click)="onCourseClick(course.id)">
      <app-course-card
        [course]="course"
        (enrollRequested)="onEnroll($event)">
      </app-course-card>
    </div>
  </ng-container>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>

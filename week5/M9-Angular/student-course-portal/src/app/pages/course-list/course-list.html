<h2>Course List</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" placeholder="Search courses" name="search">

<p *ngIf="loading$ | async">Loading courses...</p>
<p *ngIf="error$ | async as error" class="error">{{ error }}</p>

<div *ngIf="!(loading$ | async)">
  <ng-container *ngIf="(courses$ | async)?.length; else noCourses">
    <div *ngFor="let course of (courses$ | async); let i = index; trackBy: trackByCourseId" (click)="onCourseClick(course.id)">
      <app-course-card
        [course]="course"
        (enrollRequested)="onEnroll($event)">
      </app-course-card>
    </div>
  </ng-container>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>

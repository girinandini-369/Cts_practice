<h1>{{ portalName }}</h1>
<p>Welcome to the Student Course Portal — browse courses, manage enrollment, and track your progress.</p>

<div class="stats-row">
  <span>Courses Available: {{ coursesAvailable }}</span>
  <span>Enrolled: 3</span>
  <span>GPA: 3.8</span>
</div>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p *ngIf="message">{{ message }}</p>

<input [(ngModel)]="searchTerm" placeholder="Search courses">
<p>Searching for: {{ searchTerm }}</p>
<!-- [property] is one-way: component -> DOM only.
     [(ngModel)] is two-way: DOM <-> component, syncing both directions. -->

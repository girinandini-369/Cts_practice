<h1>{{ portalName }}</h1>
<p>Manage your courses, track your progress, and explore new learning opportunities all in one place.</p>
<div class="stats-row">
  <div class="stat">Courses Available: 12</div>
  <div class="stat">Enrolled: 3</div>
  <div class="stat">GPA: 3.8</div>
</div>

<!--
  [property] binding is one-way: data flows from the component class to the DOM only
  (e.g. [disabled]="!isPortalActive" pushes the component's value onto the element).
  [(ngModel)] is two-way: data flows both ways - component to DOM (initial value) and
  DOM to component (user input updates the property automatically).
-->
<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p *ngIf="message">{{ message }}</p>

<input [(ngModel)]="searchTerm" placeholder="Search courses...">
<p>Searching for: {{ searchTerm }}</p>
